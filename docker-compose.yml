name: cloudforge

services:
  postgres:
    image: postgres:18-alpine
    container_name: cloudforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Profile, so `docker compose up -d` still starts only the database.
  # Run it with: docker compose --profile sample up -d --build
  sample-app:
    profiles: [sample]
    build:
      context: ./sample-app
      args:
        COMMIT_SHA: local
        APP_VERSION: local
    container_name: cloudforge-sample-app
    restart: unless-stopped
    environment:
      PORT: 3000
      FAILURE_MODE: ${SAMPLE_FAILURE_MODE:-none}
      FAILURE_DELAY_SECONDS: ${SAMPLE_FAILURE_DELAY_SECONDS:-30}
    ports:
      - "${SAMPLE_APP_PORT:-3000}:3000"

volumes:
  postgres_data:
