spring:
  application:
    name: cloudforge-backend

  datasource:
    url: ${CLOUDFORGE_DB_URL:jdbc:postgresql://localhost:5433/cloudforge}
    username: ${CLOUDFORGE_DB_USER:cloudforge}
    password: ${CLOUDFORGE_DB_PASSWORD:local_dev_only_change_me}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

info:
  app:
    name: CloudForge Backend
    phase: "0"

logging:
  level:
    com.cloudforge.backend: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"