name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

# A new push supersedes an in-flight run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Make the Maven wrapper executable
        run: chmod +x ./mvnw
        working-directory: backend

      - name: Run tests
        run: ./mvnw -B --no-transfer-progress test
        working-directory: backend

      - name: Extract coverage
        run: |
          # Read JaCoCo's XML rather than scraping console output. The number
          # becomes a risk-model feature in Phase 7, so it has to be exact.
          REPORT=backend/target/site/jacoco/jacoco.xml
          COVERED=$(python3 -c "
          import xml.etree.ElementTree as ET
          root = ET.parse('$REPORT').getroot()
          for counter in root.findall('counter'):
              if counter.get('type') == 'LINE':
                  missed, covered = int(counter.get('missed')), int(counter.get('covered'))
                  total = missed + covered
                  print(f'{covered * 100 / total:.2f}' if total else '0.00')
                  break
          ")
          echo "LINE_COVERAGE=$COVERED" >> "$GITHUB_ENV"
          echo "Line coverage: ${COVERED}%" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish metrics for later phases
        run: |
          mkdir -p metrics
          jq -n \
            --arg coverage "$LINE_COVERAGE" \
            --arg sha "${{ github.sha }}" \
            '{commitSha: $sha, testCoverage: ($coverage | tonumber), testPassRate: 100, source: "github-actions"}' \
            > metrics/backend-metrics.json
          cat metrics/backend-metrics.json

      - name: Upload metrics
        uses: actions/upload-artifact@v6
        with:
          name: backend-metrics
          path: metrics/backend-metrics.json

  backend-smoke:
    name: Backend starts against Postgres
    runs-on: ubuntu-latest

    # Unit tests pass with mocks even when the application cannot start. This job
    # boots it against a real database and asserts the datasource and migrations
    # actually work, which is the failure mode that has bitten this project.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: cloudforge
          POSTGRES_USER: cloudforge
          POSTGRES_PASSWORD: ci_only_not_a_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloudforge -d cloudforge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CLOUDFORGE_DB_URL: jdbc:postgresql://localhost:5432/cloudforge
      CLOUDFORGE_DB_USER: cloudforge
      CLOUDFORGE_DB_PASSWORD: ci_only_not_a_secret

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Make the Maven wrapper executable
        run: chmod +x ./mvnw
        working-directory: backend

      - name: Build the application
        run: ./mvnw -B --no-transfer-progress -DskipTests package
        working-directory: backend

      - name: Start the application
        run: |
          # Globbed rather than hard-coded: the jar name follows the pom version.
          JAR=$(ls target/*.jar | head -n1)
          echo "Starting $JAR"
          java -jar "$JAR" > "$RUNNER_TEMP/backend.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/backend.pid"
        working-directory: backend

      - name: Wait for the application to report healthy
        run: |
          for attempt in $(seq 1 45); do
            if curl -sf http://localhost:8080/actuator/health > "$RUNNER_TEMP/health.json"; then
              echo "Application is up after ${attempt}s"
              cat "$RUNNER_TEMP/health.json"
              exit 0
            fi
            sleep 1
          done

          echo "Application did not start within 45s"
          cat "$RUNNER_TEMP/backend.log"
          exit 1

      - name: Assert the database component is UP
        run: |
          # Overall UP is not enough: if the datasource were missing entirely the
          # health endpoint would still report UP with no db indicator at all.
          jq -e '.components.db.status == "UP"' "$RUNNER_TEMP/health.json" > /dev/null \
            || { echo "Database component is not UP"; jq . "$RUNNER_TEMP/health.json"; exit 1; }

      - name: Assert Flyway applied its migrations
        run: |
          # This is the check that would have caught Flyway silently not running.
          TABLES=$(PGPASSWORD=ci_only_not_a_secret psql -h localhost -U cloudforge -d cloudforge -tAc \
            "SELECT table_name FROM information_schema.tables WHERE table_schema='public' ORDER BY table_name")
          echo "$TABLES"

          for table in flyway_schema_history projects deployments deployment_events; do
            echo "$TABLES" | grep -qx "$table" || { echo "Missing table: $table"; exit 1; }
          done

      - name: Show application logs on failure
        if: failure()
        run: cat "$RUNNER_TEMP/backend.log"

      - name: Stop the application
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/backend.pid")" || true

  sample-app-tests:
    name: Sample app tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          # No lockfile: the sample app has zero dependencies by design.
          package-manager-cache: false

      - name: Run tests
        run: npm test
        working-directory: sample-app

  frontend-build:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Type-check and build
        run: npm run build
        working-directory: frontend

  docker-build:
    name: Sample app image
    runs-on: ubuntu-latest
    needs: sample-app-tests

    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Record the build time
        run: echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: ./sample-app
          # Loaded into the local daemon rather than pushed: there is no registry
          # until Phase 12. The point of this job is that the image builds and the
          # container actually serves traffic.
          load: true
          push: false
          tags: |
            cloudforge-sample-app:${{ github.sha }}
            cloudforge-sample-app:${{ github.run_number }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            APP_VERSION=${{ github.run_number }}
            BUILD_TIME=${{ env.BUILD_TIME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the container
        run: |
          docker run -d --name sample -p 3000:3000 \
            cloudforge-sample-app:${{ github.sha }}

      - name: Wait for it to serve traffic
        run: |
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:3000/health > /tmp/health.json; then
              echo "Container healthy after ${attempt}s"
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done

          echo "Container did not become healthy"
          docker logs sample
          exit 1

      - name: Assert the image reports the commit it was built from
        run: |
          # Proves the build arg reached the running process. Without this, an
          # image could be tagged with one SHA and contain another.
          BUILT=$(curl -sf http://localhost:3000/ | jq -r '.commitSha')
          echo "Image reports commitSha=$BUILT"
          [ "$BUILT" = "${{ github.sha }}" ] || { echo "Expected ${{ github.sha }}"; exit 1; }

      - name: Assert the process runs as a non-root user
        run: |
          USER=$(docker exec sample whoami)
          echo "Container user: $USER"
          [ "$USER" = "node" ] || { echo "Expected node, got $USER"; exit 1; }

      - name: Report image size
        run: docker images cloudforge-sample-app:${{ github.sha }} --format "{{.Size}}"

      - name: Show container logs on failure
        if: failure()
        run: docker logs sample || true

      - name: Clean up
        if: always()
        run: docker rm -f sample || true
  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the image to scan
        uses: docker/build-push-action@v7
        with:
          context: ./sample-app
          load: true
          push: false
          tags: cloudforge-sample-app:${{ github.sha }}
          cache-from: type=gha

      - name: Scan the image
        run: |
          # Trivy is run as its official container rather than via a third-party
          # action, so there is no action version to drift.
          mkdir -p "$RUNNER_TEMP/trivy-cache" scan
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/trivy-cache":/root/.cache \
            -v "$PWD/scan":/scan \
            aquasec/trivy:latest image \
              --scanners vuln \
              --format json \
              --output /scan/image.json \
              cloudforge-sample-app:${{ github.sha }}

      - name: Scan the repository for dependency and config issues
        run: |
          docker run --rm \
            -v "$RUNNER_TEMP/trivy-cache":/root/.cache \
            -v "$PWD":/src \
            aquasec/trivy:latest fs \
              --scanners vuln,secret,misconfig \
              --format json \
              --output /src/scan/repo.json \
              /src

      - name: Summarise findings
        run: |
          count() {
            jq "[.Results[]?.Vulnerabilities[]? | select(.Severity == \"$2\")] | length" "$1"
          }

          CRITICAL=$(count scan/image.json CRITICAL)
          HIGH=$(count scan/image.json HIGH)
          MEDIUM=$(count scan/image.json MEDIUM)
          LOW=$(count scan/image.json LOW)
          SECRETS=$(jq '[.Results[]?.Secrets[]?] | length' scan/repo.json)

          {
            echo "### Security scan"
            echo ""
            echo "| Severity | Image |"
            echo "|---|---|"
            echo "| Critical | $CRITICAL |"
            echo "| High | $HIGH |"
            echo "| Medium | $MEDIUM |"
            echo "| Low | $LOW |"
            echo ""
            echo "Secrets found in the repository: $SECRETS"
          } >> "$GITHUB_STEP_SUMMARY"

          jq -n \
            --argjson critical "$CRITICAL" --argjson high "$HIGH" \
            --argjson medium "$MEDIUM" --argjson low "$LOW" \
            --arg sha "${{ github.sha }}" \
            '{commitSha: $sha, criticalVulnerabilities: $critical, highVulnerabilities: $high,
              mediumVulnerabilities: $medium, lowVulnerabilities: $low, source: "github-actions"}' \
            > scan/security-metrics.json

          echo "CRITICAL_COUNT=$CRITICAL" >> "$GITHUB_ENV"
          echo "SECRET_COUNT=$SECRETS" >> "$GITHUB_ENV"

      - name: Fail on a committed secret
        run: |
          # Unconditional. A leaked credential is not a severity judgement.
          [ "$SECRET_COUNT" -eq 0 ] || {
            echo "Secrets detected in the repository"
            jq '.Results[]? | select(.Secrets) | {Target, Secrets: [.Secrets[] | {RuleID, Title, StartLine}]}' scan/repo.json
            exit 1
          }

      - name: Fail on critical vulnerabilities
        run: |
          [ "$CRITICAL_COUNT" -eq 0 ] || {
            echo "$CRITICAL_COUNT critical vulnerabilities in the image"
            jq -r '.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")
                   | "\(.VulnerabilityID)  \(.PkgName) \(.InstalledVersion) -> \(.FixedVersion // "no fix")"' \
              scan/image.json
            exit 1
          }

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: security-scan
          path: scan/
